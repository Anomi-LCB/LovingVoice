<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LovingVoice - 실시간 AI 통역</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .pulse-red { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden">
    <div class="w-full max-w-lg space-y-8">
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">LovingVoice</h1>
            <p class="text-gray-400 font-medium">실시간 다국어 AI 통역 시스템</p>
        </header>

        <main class="glass rounded-3xl p-8 shadow-2xl relative">
            <!-- Entry Setup (메인 화면) -->
            <div id="setup_box" class="space-y-6">
                <div class="space-y-4">
                    <label class="block text-sm font-medium text-gray-400 ml-1">강연장 코드</label>
                    <input type="text" id="room_id" placeholder="예: 7777" class="w-full bg-slate-800/50 border border-white/10 rounded-2xl p-4 text-center text-xl font-bold focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="startSpeaker()" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl font-bold transition-all transform hover:scale-105 shadow-lg shadow-blue-500/20">강연 시작</button>
                    <div class="space-y-1">
                        <select id="lang" class="w-full bg-slate-800 border border-white/10 rounded-2xl p-4 font-bold outline-none text-center text-sm">
                            <option value="ko-KR">한국어</option>
                            <option value="en-US">English</option>
                            <option value="zh-TW">繁體中文</option>
                            <option value="zh-CN">简体中文</option>
                            <option value="ja-JP">日本語</option>
                        </select>
                        <button onclick="startAudience()" class="w-full bg-slate-700 hover:bg-slate-600 p-2 rounded-xl text-sm font-semibold transition-all">청중 입장</button>
                    </div>
                </div>
            </div>

            <!-- Active Status (입장 후 화면) -->
            <div id="active_box" class="hidden space-y-8 py-4">
                <div class="flex items-center justify-between">
                    <div id="status_indicator" class="flex items-center space-x-3">
                        <div id="status_dot" class="w-3 h-3 rounded-full bg-gray-500"></div>
                        <span id="status_text" class="font-semibold text-gray-300">연결 준비 중...</span>
                    </div>
                    <button onclick="location.reload()" class="text-xs text-gray-500 hover:text-white underline">나가기</button>
                </div>

                <!-- 강연자 전용 컨트롤 (입장 후에만 노출) -->
                <div id="speaker_controls" class="hidden space-y-4 border-t border-white/5 pt-4">
                    <div class="flex flex-col gap-3">
                        <button id="start_btn" onclick="toggleTranslation()" 
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20">
                             통역 시작
                        </button>
                        <button onclick="sendTestAudio()" 
                                class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-3 px-6 rounded-lg border border-slate-600 transition-all flex items-center justify-center gap-2">
                             🔔 테스트 벨 소리 송출
                        </button>
                    </div>
                    <div class="bg-black/20 p-3 rounded-lg text-xs text-slate-500 italic" id="transcript_preview">
                        마이크를 켜고 말씀을 시작하세요...
                    </div>
                </div>

                <!-- 자막 영역 -->
                <div id="subtitle_area" class="min-h-[140px] bg-slate-900/50 rounded-xl p-6 mb-6 flex items-center justify-center text-center text-xl text-gray-400 italic leading-relaxed backdrop-blur-sm border border-white/5 shadow-inner relative">
                    음성을 감지하는 중입니다...
                </div>

                <!-- 청중 전용: 오디오 활성화 -->
                <div id="audio_activation_layer" class="hidden flex justify-center mb-6">
                    <button onclick="activateAudio()" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-full shadow-lg shadow-blue-500/20 transition-all transform hover:scale-105 flex items-center gap-3">
                        <span class="text-2xl animate-bounce">🔊</span> 통역 듣기 시작
                    </button>
                </div>

                <!-- Visualizer EQ -->
                <div id="visualizer" class="flex justify-center items-end space-x-1 h-16">
                </div>
            </div>
        </main>

        <footer class="mt-8 text-center text-gray-500 text-sm">
            &copy; 2026 LovingVoice AI. All Rights Reserved.
        </footer>
    </div>

    <script>
    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const host = window.location.host;
    
    let audioCtx;
    let analyser;
    let dataArray;
    let ws;
    let isTranslating = false;

    function showActiveUI(type) {
        document.getElementById('setup_box').classList.add('hidden');
        document.getElementById('active_box').classList.remove('hidden');
        if (type === 'speaker') {
            document.getElementById('speaker_controls').classList.remove('hidden');
        }
    }

    function setStatus(status, text) {
        const dot = document.getElementById('status_dot');
        const stText = document.getElementById('status_text');
        stText.innerText = text;
        dot.className = "w-3 h-3 rounded-full";
        if (status === 'connected') dot.classList.add('bg-green-500');
        else if (status === 'active') dot.classList.add('bg-red-500', 'pulse-red');
        else dot.classList.add('bg-gray-500');
    }

    async function setupAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            const visualizer = document.getElementById('visualizer');
            visualizer.innerHTML = '';
            for (let i = 0; i < bufferLength / 2; i++) {
                const bar = document.createElement('div');
                bar.className = 'w-1.5 bg-blue-500 rounded-full transition-all duration-75';
                bar.style.height = '4px';
                visualizer.appendChild(bar);
            }
            draw();
        }
        if (audioCtx.state === 'suspended') await audioCtx.resume();
    }

    function draw() {
        requestAnimationFrame(draw);
        if (!analyser) return;
        analyser.getByteFrequencyData(dataArray);
        const bars = document.getElementById('visualizer').children;
        for (let i = 0; i < bars.length; i++) {
            const val = dataArray[i];
            bars[i].style.height = `${Math.max(4, (val / 255) * 64)}px`;
            bars[i].style.opacity = 0.3 + (val / 255) * 0.7;
        }
    }

    async function startSpeaker() {
        const room = document.getElementById('room_id').value;
        if (!room) return alert("강연장 코드를 입력하세요.");
        showActiveUI('speaker');
        ws = new WebSocket(`${protocol}://${host}/ws/speaker/${room}`);
        
        ws.onopen = async () => {
            setStatus('connected', '🔗 강연 접속됨');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({audio: true});
                await setupAudio();
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                
                const processor = audioCtx.createScriptProcessor(4096, 1, 1);
                source.connect(processor);
                processor.connect(audioCtx.destination);

                processor.onaudioprocess = (e) => {
                    if (!isTranslating) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const ratio = audioCtx.sampleRate / 16000;
                    const newLength = Math.round(inputData.length / ratio);
                    const pcmData = new Int16Array(newLength);
                    for (let i = 0; i < newLength; i++) {
                        const offset = Math.round(i * ratio);
                        const s = Math.max(-1, Math.min(1, inputData[offset]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    if (ws.readyState === 1) ws.send(pcmData.buffer);
                };
            } catch (err) { alert("마이크 권한이 필요합니다."); }
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'transcript') {
                const area = document.getElementById('subtitle_area');
                area.innerText = data.text;
                document.getElementById('transcript_preview').innerText = data.text;
            }
        };
    }

    function toggleTranslation() {
        isTranslating = !isTranslating;
        const btn = document.getElementById('start_btn');
        if (isTranslating) {
            btn.innerText = "통역 중지";
            btn.className = btn.className.replace('bg-blue-600', 'bg-red-600');
            setStatus('active', '🎙️ 실시간 방송 중');
        } else {
            btn.innerText = "통역 시작";
            btn.className = btn.className.replace('bg-red-600', 'bg-blue-600');
            setStatus('connected', '🔗 대기 중');
        }
    }

    function sendTestAudio() {
        const room = document.getElementById('room_id').value;
        if (ws && ws.readyState === 1) {
            console.log(`[SPEAKER] Sending test bell to Room: ${room}`);
            const msg = {type: 'test_audio', room: room};
            ws.send(JSON.stringify(msg));
            
            // 즉각적인 UI 피드백
            const preview = document.getElementById('transcript_preview');
            preview.innerText = "🔔 [시스템] 테스트 벨 소리를 서버로 쐈습니다. 청중 화면을 확인하세요.";
            preview.classList.add('text-green-400', 'not-italic');
            setTimeout(() => {
                preview.classList.remove('text-green-400', 'not-italic');
                preview.innerText = "마이크를 켜고 말씀을 시작하세요...";
            }, 3000);
        } else {
            alert("연결이 끊겼습니다. 다시 입장해 주세요.");
        }
    }

    async function activateAudio() {
        await setupAudio();
        document.getElementById('audio_activation_layer').classList.add('hidden');
        document.getElementById('subtitle_area').innerText = "🎧 오디오 활성화됨. 통역 대기 중...";
    }

                        // 시각적 배너 (실시간 생성)
                        const toast = document.createElement('div');
                        toast.className = "fixed top-10 right-10 bg-red-600 text-white font-black px-6 py-4 rounded-2xl animate-bounce z-[9999] shadow-[0_0_30px_rgba(220,38,38,0.5)] border-4 border-white";
                        toast.innerHTML = "🔊 <span class='text-xl'>AUDIO PLAYING</span>";
                        document.body.appendChild(toast);

                        area.classList.remove('italic', 'text-gray-400');
                        area.classList.add('text-white', 'font-semibold', 'text-blue-400');

                                source.connect(audioCtx.destination);

                                console.warn("Web Audio Failed, trying Fallback...");
                                const sniffAudio = new Audio(`data:audio/mp3;base64,${b64}`);
                                sniffAudio.play().then(() => console.log("SUCCESS: Fallback Playback"))
                                           .catch(e => console.error("CRITICAL: All Playback Failed", e));
                            });
                        } catch (err) { console.error("Pipeline Crash:", err); }
                    } else if (data.type === 'transcript') {
                        const area = document.getElementById('subtitle_area');
                        area.innerText = data.text;
                        area.classList.add('italic', 'text-gray-400');
                    }
                } catch (err) { console.error("JSON Error:", err); }
            };
            ws.onclose = () => {
                setStatus('offline', '⚠️ 재연결 중...');
                setTimeout(connect, 2000);
            };
        }
        connect();
    }
    </script>
</body>
</html>
