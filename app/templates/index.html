<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LovingVoice - 실시간 AI 통역</title>
    <link rel="icon" href="data:,">
    <script>
        try {
            if (localStorage.getItem('lovingvoice:theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (error) {}
    </script>
    <link rel="stylesheet" href="/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html { color-scheme: light; }
        html[data-theme="dark"] { color-scheme: dark; }
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f4f7fb;
            color: #172033;
            transition: background-color 180ms ease, color 180ms ease;
        }
        .glass {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(15, 23, 42, 0.12);
        }
        html[data-theme="dark"] body { background-color: #0f172a; color: #f8fafc; }
        html[data-theme="dark"] .glass { background: rgba(30, 41, 59, 0.7); border-color: rgba(255, 255, 255, 0.1); }

        html[data-theme="light"] .bg-slate-800 { background-color: #ffffff; }
        html[data-theme="light"] .bg-slate-700 { background-color: #e2e8f0; color: #1e293b; }
        html[data-theme="light"] .hover\:bg-slate-600:hover { background-color: #cbd5e1; }
        html[data-theme="light"] .hover\:bg-slate-700:hover { background-color: #e2e8f0; }
        html[data-theme="light"] .bg-blue-950 { background-color: #eff6ff; color: #1d4ed8; }
        html[data-theme="light"] .hover\:bg-blue-900:hover { background-color: #dbeafe; }
        html[data-theme="light"] .border-slate-700 { border-color: #cbd5e1; }
        html[data-theme="light"] .border-slate-600 { border-color: #94a3b8; }
        html[data-theme="light"] .border-blue-800 { border-color: #bfdbfe; }
        html[data-theme="light"] .text-slate-400 { color: #64748b; }
        html[data-theme="light"] .text-blue-400 { color: #2563eb; }
        html[data-theme="light"] .text-blue-300 { color: #2563eb; }
        html[data-theme="light"] .text-blue-100 { color: #1e3a8a; }
        html[data-theme="light"] input,
        html[data-theme="light"] select { color: #172033; }
        html[data-theme="light"] input::placeholder { color: #94a3b8; }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            min-width: 92px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            background: rgba(255, 255, 255, 0.9);
            color: #334155;
            font-size: 0.875rem;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
            transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease;
        }
        .theme-toggle:hover { background: #f1f5f9; }
        .theme-toggle:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
        html[data-theme="dark"] .theme-toggle {
            border-color: #475569;
            background: rgba(30, 41, 59, 0.92);
            color: #f8fafc;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        html[data-theme="dark"] .theme-toggle:hover { background: #334155; }
        .pulse-red { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <button id="theme_toggle" type="button" class="theme-toggle" onclick="toggleTheme()" aria-pressed="false">다크 모드</button>
    <div id="setup_box" class="glass p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">LovingVoice</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">방 이름</label>
                <input type="text" id="room_id" maxlength="40" autocomplete="off" spellcheck="false" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="예: 주일예배">
                <p id="room_hint" class="mt-2 text-xs text-slate-400">강연자가 사용할 방 이름을 직접 입력하세요.</p>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">방 비밀번호</label>
                <input type="text" id="room_password" minlength="4" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="직접 입력 (4자 이상)">
                <p class="mt-2 text-xs text-slate-400">청중은 방 이름과 이 비밀번호로 입장합니다.</p>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">내 언어 (수신용)</label>
                <select id="lang_select" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 outline-none">
                    <option value="ko-KR">한국어</option>
                    <option value="en-US">English</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="ja-JP">日本語</option>
                    <option value="vi-VN">Tiếng Việt (베트남어)</option>
                    <option value="ta-IN">தமிழ் (타밀어)</option>
                    <option value="ne-NP">नेपाली (네팔어)</option>
                    <option value="mn-MN">Монгол (몽골어)</option>
                    <option value="my-MM">မြန်မာ (버마어)</option>
                    <option value="km-KH">ខ្មែរ (크메르어)</option>
                </select>
            </div>
            <div class="flex gap-3 pt-2">
                <button id="speaker_start_button" onclick="startSpeaker()" class="flex-1 bg-blue-600 hover:bg-blue-500 transition-colors font-bold py-3 rounded-xl shadow-lg">강연 시작</button>
                <button onclick="startAudience()" class="flex-1 bg-slate-700 hover:bg-slate-600 transition-colors font-bold py-3 rounded-xl shadow-lg">청중 입장</button>
            </div>
            <input type="hidden" id="voice_mode" value="openai">
        </div>
    </div>

    <div id="active_ui" class="hidden w-full max-w-4xl space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 glass p-4 rounded-xl">
            <div class="flex min-w-0 items-center gap-3">
                <div id="status_dot" class="w-3 h-3 rounded-full bg-gray-500"></div>
                <span id="status_text" class="text-sm font-medium">연결 준비 중...</span>
            </div>
            <div class="flex flex-wrap items-center justify-end gap-2">
                <button onclick="copyAudienceLink()" class="text-sm bg-blue-950 hover:bg-blue-900 px-3 py-1.5 rounded-full border border-blue-800">초대 정보 복사</button>
                <div id="room_display" class="text-sm bg-slate-800 px-3 py-1 rounded-full border border-slate-700">방: -</div>
                <button onclick="leaveSession()" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-full border border-slate-700">나가기</button>
            </div>
        </div>

        <div class="glass p-4 rounded-2xl h-[400px] md:h-[500px] flex flex-col w-full text-left overflow-hidden">
            <div class="flex items-center justify-between px-4 pb-3 text-xs text-slate-400">
                <span id="recent_history_label">최근 5분 자막</span>
                <span id="route_badge" class="rounded-full bg-slate-800 px-3 py-1">공유 언어 채널</span>
            </div>
            <!-- 히스토리 영역 (채팅처럼 이전 대화 기록) -->
            <div id="history_area" aria-live="polite" class="flex-1 overflow-y-auto space-y-3 pb-4 opacity-70 text-xl md:text-2xl font-medium px-4 scroll-smooth">
            </div>
            <!-- 활성 문장 (현재 대화 중인 가장 크고 밝은 텍스트) -->
            <div id="subtitle_area" aria-live="assertive" class="text-2xl md:text-4xl font-bold leading-tight break-keep pt-4 border-t border-slate-700 px-4 min-h-[80px] text-blue-100">
                강연이 시작되면 여기에 실시간 통역 자막이 표시됩니다.
            </div>
        </div>

        <div id="speaker_controls" class="hidden glass p-4 rounded-xl flex flex-wrap justify-center gap-3">
            <button id="mute_button" onclick="toggleMute()" class="bg-slate-700 hover:bg-slate-600 px-6 py-2 rounded-lg font-bold transition-all">
                마이크 음소거
            </button>
            <button id="record_button" onclick="toggleRecording()" class="bg-blue-700 hover:bg-blue-600 px-6 py-2 rounded-lg font-bold transition-all">
                녹음 시작
            </button>
            <a id="recording_download" onclick="markRecordingSaved()" class="hidden bg-blue-950 hover:bg-blue-900 px-6 py-2 rounded-lg font-bold transition-all" href="#">
                녹음 파일 저장
            </a>
            <button onclick="sendTestAudio()" class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-lg font-bold transition-all flex items-center gap-2">
                테스트 알림 발송
            </button>
            <button onclick="leaveSession()" class="bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-lg font-bold transition-all">
                방송 종료
            </button>
            <p id="recording_status" class="w-full text-center text-xs text-slate-400">원본 음성은 이 기기에서만 녹음됩니다.</p>
        </div>
    </div>

    <script>
        let ws;
        let audioCtx;
        let playbackCtx;
        let workletNode;
        let micStream;
        const nextPlaybackTimes = new Map();
        let reconnectTimer;
        let heartbeatTimer;
        let audienceConfig;
        let currentRoom = '';
        let isLeaving = false;
        let speakerAuthenticated = false;
        let isMuted = false;
        let mediaRecorder = null;
        let recordingChunks = [];
        let recordingStartedAt = 0;
        let recordingTimer = null;
        let recordingUrl = '';
        let recordingMimeType = '';
        let recordingStopResolver = null;
        let downloadRecordingOnStop = false;
        let recordingSaved = false;
        const COMPLETED_CAPTION_HOLD_MS = 2200;

        function applyTheme(theme, { persist = true } = {}) {
            const nextTheme = theme === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = nextTheme;
            const toggle = document.getElementById('theme_toggle');
            if (toggle) {
                const isDark = nextTheme === 'dark';
                toggle.innerText = isDark ? '라이트 모드' : '다크 모드';
                toggle.setAttribute('aria-pressed', String(isDark));
                toggle.setAttribute('aria-label', isDark ? '라이트 모드로 전환' : '다크 모드로 전환');
            }
            if (persist) {
                try {
                    localStorage.setItem('lovingvoice:theme', nextTheme);
                } catch (error) {}
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.dataset.theme;
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        function setStatus(state, text) {
            const dot = document.getElementById('status_dot');
            const lbl = document.getElementById('status_text');
            lbl.innerText = text;
            dot.className = 'w-3 h-3 rounded-full ' + (state === 'online' ? 'bg-green-500' : (state === 'error' ? 'bg-red-500 pulse-red' : 'bg-gray-500'));
        }

        function showActiveUI(isSpeaker) {
            document.getElementById('setup_box').classList.add('hidden');
            document.getElementById('active_ui').classList.remove('hidden');
            if (isSpeaker) document.getElementById('speaker_controls').classList.remove('hidden');
            currentRoom = cleanRoomId(document.getElementById('room_id').value);
            document.getElementById('room_display').innerText = '방: ' + currentRoom;
        }

        function cleanRoomId(value) {
            return value
                .trim()
                .replace(/\s+/g, '-')
                .replace(/[^\p{L}\p{N}_-]/gu, '')
                .slice(0, 40);
        }

        async function copyAudienceLink() {
            const room = currentRoom || cleanRoomId(document.getElementById('room_id').value);
            if (!room) return alert('방 이름이 없습니다.');
            const url = new URL(window.location.href);
            url.search = '';
            url.searchParams.set('room', room);
            url.searchParams.set('mode', 'audience');
            const roomPassword = document.getElementById('room_password').value.trim();
            const invitation = roomPassword
                ? `LovingVoice 청중 초대\n방 이름: ${room}\n방 비밀번호: ${roomPassword}\n입장 링크: ${url}`
                : url.toString();
            try {
                await navigator.clipboard.writeText(invitation);
                setStatus('online', '방 이름과 비밀번호를 포함한 청중 초대 정보를 복사했습니다.');
            } catch (error) {
                prompt('아래 초대 정보를 복사하세요.', invitation);
            }
        }

        function toggleMute() {
            if (!micStream) return;
            isMuted = !isMuted;
            micStream.getAudioTracks().forEach(track => { track.enabled = !isMuted; });
            document.getElementById('mute_button').innerText = isMuted ? '마이크 켜기' : '마이크 음소거';
            setStatus('online', isMuted ? '방송 중 · MIC OFF' : '방송 중 · MIC ON');
        }

        function selectRecordingMimeType() {
            if (!window.MediaRecorder) return '';
            return [
                'audio/webm;codecs=opus',
                'audio/mp4',
                'audio/webm',
                'audio/ogg;codecs=opus'
            ].find(type => MediaRecorder.isTypeSupported(type)) || '';
        }

        function recordingExtension(mimeType) {
            if (mimeType.includes('mp4')) return 'm4a';
            if (mimeType.includes('ogg')) return 'ogg';
            return 'webm';
        }

        function recordingFileName() {
            const stamp = new Date().toISOString()
                .replace(/[-:]/g, '')
                .replace('T', '-')
                .replace(/\..+/, '');
            return `LovingVoice-${currentRoom || 'lecture'}-${stamp}.${recordingExtension(recordingMimeType)}`;
        }

        function markRecordingSaved() {
            recordingSaved = true;
        }

        function formatRecordingDuration() {
            const totalSeconds = Math.max(0, Math.floor((Date.now() - recordingStartedAt) / 1000));
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function startRecording() {
            if (!window.MediaRecorder) {
                alert('이 브라우저는 녹음 기능을 지원하지 않습니다. 최신 Chrome, Edge 또는 Safari를 사용해주세요.');
                return;
            }
            if (!micStream?.active) {
                alert('마이크 연결이 완료된 후 녹음을 시작해주세요.');
                return;
            }
            if (mediaRecorder?.state === 'recording') return;

            if (recordingUrl) {
                URL.revokeObjectURL(recordingUrl);
                recordingUrl = '';
            }
            const download = document.getElementById('recording_download');
            download.classList.add('hidden');
            download.removeAttribute('href');
            recordingChunks = [];
            recordingSaved = false;
            recordingMimeType = selectRecordingMimeType();
            const options = recordingMimeType ? { mimeType: recordingMimeType } : undefined;

            try {
                mediaRecorder = new MediaRecorder(micStream, options);
            } catch (error) {
                alert('녹음을 시작할 수 없습니다: ' + error.message);
                return;
            }

            mediaRecorder.ondataavailable = event => {
                if (event.data?.size) recordingChunks.push(event.data);
            };
            mediaRecorder.onerror = event => {
                document.getElementById('recording_status').innerText = `녹음 오류: ${event.error?.message || '알 수 없는 오류'}`;
            };
            mediaRecorder.onstop = () => {
                clearInterval(recordingTimer);
                recordingTimer = null;
                const mimeType = mediaRecorder?.mimeType || recordingMimeType || 'audio/webm';
                const blob = new Blob(recordingChunks, { type: mimeType });
                if (blob.size) {
                    recordingUrl = URL.createObjectURL(blob);
                    download.href = recordingUrl;
                    download.download = recordingFileName();
                    download.classList.remove('hidden');
                    document.getElementById('recording_status').innerText = `녹음 완료 · ${(blob.size / 1024 / 1024).toFixed(1)}MB`;
                    if (downloadRecordingOnStop) download.click();
                } else {
                    document.getElementById('recording_status').innerText = '녹음된 음성이 없습니다.';
                }
                document.getElementById('record_button').innerText = '새 녹음 시작';
                recordingChunks = [];
                mediaRecorder = null;
                downloadRecordingOnStop = false;
                recordingStopResolver?.();
                recordingStopResolver = null;
            };

            mediaRecorder.start(1000);
            recordingStartedAt = Date.now();
            document.getElementById('record_button').innerText = '녹음 중지';
            document.getElementById('recording_status').innerText = '녹음 중 · 00:00';
            recordingTimer = setInterval(() => {
                document.getElementById('recording_status').innerText = `녹음 중 · ${formatRecordingDuration()}`;
            }, 1000);
        }

        function stopRecording(downloadAfterStop = false) {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return Promise.resolve();
            downloadRecordingOnStop = downloadRecordingOnStop || downloadAfterStop;
            return new Promise(resolve => {
                recordingStopResolver = resolve;
                mediaRecorder.stop();
            });
        }

        async function toggleRecording() {
            if (mediaRecorder?.state === 'recording') {
                await stopRecording(false);
            } else {
                startRecording();
            }
        }

        async function leaveSession() {
            isLeaving = true;
            speakerAuthenticated = false;
            clearTimeout(reconnectTimer);
            clearInterval(heartbeatTimer);
            if (mediaRecorder?.state === 'recording') {
                await stopRecording(true);
            } else if (recordingUrl && !recordingSaved) {
                document.getElementById('recording_download').click();
            }
            if (ws) {
                ws.onclose = null;
                ws.close(1000, 'User left');
                ws = null;
            }
            if (workletNode) {
                workletNode.disconnect();
                workletNode = null;
            }
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }
            if (audioCtx) {
                await audioCtx.close().catch(() => {});
                audioCtx = null;
            }
            if (playbackCtx) {
                await playbackCtx.close().catch(() => {});
                playbackCtx = null;
            }
            nextPlaybackTimes.clear();
            clearInterval(recordingTimer);
            recordingTimer = null;
            mediaRecorder = null;
            recordingChunks = [];
            recordingStartedAt = 0;
            recordingMimeType = '';
            recordingSaved = false;
            if (recordingUrl) {
                const urlToRevoke = recordingUrl;
                setTimeout(() => URL.revokeObjectURL(urlToRevoke), 10000);
                recordingUrl = '';
            }
            const recordingDownload = document.getElementById('recording_download');
            recordingDownload.classList.add('hidden');
            recordingDownload.removeAttribute('href');
            document.getElementById('record_button').innerText = '녹음 시작';
            document.getElementById('recording_status').innerText = '원본 음성은 이 기기에서만 녹음됩니다.';
            isMuted = false;
            document.getElementById('mute_button').innerText = '마이크 음소거';
            document.getElementById('active_ui').classList.add('hidden');
            document.getElementById('speaker_controls').classList.add('hidden');
            document.getElementById('setup_box').classList.remove('hidden');
            document.getElementById('history_area').replaceChildren();
            document.getElementById('subtitle_area').innerText = '강연이 시작되면 여기에 실시간 통역 자막이 표시됩니다.';
            audienceConfig = null;
            isLeaving = false;
        }

        function ensurePlaybackContext() {
            if (!playbackCtx) playbackCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            if (playbackCtx.state === 'suspended') playbackCtx.resume();
            return playbackCtx;
        }

        function playPcm16(base64Audio, sampleRate = 24000, sourceId = 'default') {
            if (!base64Audio) return;
            const ctx = ensurePlaybackContext();
            const binary = atob(base64Audio);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const pcm = new Int16Array(bytes.buffer);
            const buffer = ctx.createBuffer(1, pcm.length, sampleRate);
            const channel = buffer.getChannelData(0);
            for (let i = 0; i < pcm.length; i++) channel[i] = pcm[i] / 32768;
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            const now = ctx.currentTime;
            let nextTime = nextPlaybackTimes.get(sourceId) || 0;
            if (nextTime < now) nextTime = now + 0.02;
            source.start(nextTime);
            nextPlaybackTimes.set(sourceId, nextTime + buffer.duration);
        }

        async function startSpeaker() {
            const room = cleanRoomId(document.getElementById('room_id').value);
            const password = document.getElementById('room_password').value.trim();
            if (room.length < 2) return alert('방 이름을 2자 이상 입력하세요.');
            if (password.length < 4 || password.length > 32) return alert('방 비밀번호를 4~32자로 입력하세요.');

            try {
                let token = sessionStorage.getItem(`lovingvoice:host-token:${room}`) || '';
                const savedPassword = sessionStorage.getItem(`lovingvoice:room-password:${room}`) || '';
                if (token && savedPassword && savedPassword !== password) {
                    return alert('이 방을 시작할 때 설정한 비밀번호를 입력하세요.');
                }
                if (!token) {
                    const response = await fetch('/api/rooms', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ room_id: room, room_password: password })
                    });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.detail || '방을 시작할 수 없습니다.');
                    }
                    token = payload.speaker_token;
                    sessionStorage.setItem(`lovingvoice:host-token:${room}`, token);
                    sessionStorage.setItem(`lovingvoice:room-password:${room}`, password);
                }
                isLeaving = false;
                speakerAuthenticated = false;
                showActiveUI(true);
                setStatus('offline', '마이크 권한 요청 중...');

                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
                });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                
                await audioCtx.audioWorklet.addModule('/recorder-worklet.js');
                const source = audioCtx.createMediaStreamSource(micStream);
                workletNode = new AudioWorkletNode(audioCtx, 'recorder-processor');
                
                const voiceMode = document.getElementById('voice_mode').value;
                const engine = voiceMode === 'openai' ? 'openai' : 'legacy';
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/ws/speaker/${encodeURIComponent(room)}?voice_mode=${encodeURIComponent(voiceMode)}&engine=${engine}`);
                
                ws.onopen = () => {
                    setStatus('offline', '강연자 권한 확인 중...');
                    ws.send(JSON.stringify({ type: 'authenticate', token }));
                };
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'authenticated') {
                        speakerAuthenticated = true;
                        setStatus('online', engine === 'openai' ? 'GPT Realtime 방송 중 · MIC ON' : '기존 엔진 방송 중 · MIC ON');
                    }
                    if (data.type === 'engine_status') setStatus(data.state || 'online', data.message);
                    if (data.type === 'engine_error') setStatus('error', data.message || '통역 엔진 오류');
                };
                ws.onclose = (e) => {
                    speakerAuthenticated = false;
                    if (e.code === 4001) {
                        sessionStorage.removeItem(`lovingvoice:host-token:${room}`);
                        alert('강연자 인증이 만료되었습니다. 같은 방 이름과 비밀번호로 다시 시작하세요.');
                        leaveSession();
                    } else {
                        setStatus('offline', '연결 종료됨');
                    }
                };
                
                workletNode.port.onmessage = (e) => {
                    if (speakerAuthenticated && !isMuted && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(e.data.buffer);
                    }
                };

                source.connect(workletNode);
                const silentGain = audioCtx.createGain();
                silentGain.gain.value = 0;
                workletNode.connect(silentGain).connect(audioCtx.destination);
            } catch (err) {
                console.error('AudioWorklet Error:', err);
                setStatus('error', '마이크 설정 실패 (' + err.message + ')');
            }
        }

        function startAudience() {
            const room = cleanRoomId(document.getElementById('room_id').value);
            const lang = document.getElementById('lang_select').value;
            const password = document.getElementById('room_password').value.trim();
            if (!room) return alert('방 이름을 입력하세요.');
            if (!password) return alert('방을 만든 강연자에게 받은 방 비밀번호를 입력하세요.');
            sessionStorage.setItem(`lovingvoice:room-password:${room}`, password);
            isLeaving = false;
            showActiveUI(false);
            ensurePlaybackContext();
            setStatus('offline', '통역 서버 접속 중...');
            audienceConfig = { room, lang, password };
            connectAudience();
        }

        function createCaptionDisplayController(area, onPromote, holdMs = COMPLETED_CAPTION_HOLD_MS) {
            let sequence = 0;
            let activeKey = '';
            let pendingPromotion = null;

            function showWaitingState() {
                area.innerText = '다음 실시간 통역을 기다리는 중…';
                area.classList.add('italic', 'text-blue-300');
                area.dataset.captionState = 'waiting';
                area.dataset.captionKey = '';
            }

            function promotePendingCaption() {
                if (!pendingPromotion) return;
                const completed = pendingPromotion;
                clearTimeout(completed.timer);
                pendingPromotion = null;
                onPromote(completed.text, completed.caption);
                if (area.dataset.captionKey === completed.key) showWaitingState();
                if (activeKey === completed.key) activeKey = '';
            }

            function startCaption() {
                // A new sentence always owns the lower panel. If the previous
                // sentence is still in its reading pause, move it up now.
                promotePendingCaption();
                activeKey = `caption-${Date.now()}-${++sequence}`;
                area.dataset.captionKey = activeKey;
                area.dataset.captionState = 'live';
                area.classList.remove('italic', 'text-blue-300');
            }

            function updateCaption(text, { sourcePreview = false } = {}) {
                if (!text) return;
                if (!activeKey) startCaption();
                area.innerText = text;
                area.dataset.captionState = 'live';
                area.classList.toggle('italic', sourcePreview);
                area.classList.toggle('text-blue-300', sourcePreview);
            }

            function completeCaption(text, caption = null) {
                if (!text) return;
                if (
                    pendingPromotion
                    && pendingPromotion.text === text
                    && (
                        !caption?.id
                        || !pendingPromotion.caption?.id
                        || caption.id === pendingPromotion.caption.id
                    )
                ) {
                    if (caption) pendingPromotion.caption = caption;
                    return;
                }
                if (pendingPromotion) promotePendingCaption();
                if (!activeKey) startCaption();
                area.innerText = text;
                area.classList.remove('italic', 'text-blue-300');
                area.dataset.captionState = 'completed';
                area.dataset.captionKey = activeKey;
                pendingPromotion = {
                    key: activeKey,
                    text,
                    caption,
                    timer: setTimeout(promotePendingCaption, holdMs)
                };
            }

            function dispose({ promote = false } = {}) {
                if (!pendingPromotion) return;
                if (promote) promotePendingCaption();
                else {
                    clearTimeout(pendingPromotion.timer);
                    pendingPromotion = null;
                }
            }

            return {
                startCaption,
                updateCaption,
                completeCaption,
                promotePendingCaption,
                dispose
            };
        }

        function connectAudience() {
            if (!audienceConfig || isLeaving) return;
            const { room, lang, password } = audienceConfig;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/audience/${encodeURIComponent(room)}/${encodeURIComponent(lang)}`);

            const translations = new Map();
            const sourceTranscripts = new Map();
            const area = document.getElementById('subtitle_area');
            const historyBox = document.getElementById('history_area');
            const historyKey = `lovingvoice:subtitles:${room}:${lang}`;
            let recentHistoryLimit = 30;
            let recentHistoryMaxAgeMs = 5 * 60 * 1000;
            const seenCaptionIds = new Set(
                [...historyBox.querySelectorAll('[data-caption-id]')]
                    .map(element => element.dataset.captionId)
                    .filter(Boolean)
            );

            function isRecentHistoryItem(item) {
                if (!item || typeof item !== 'object' || !item.created_at) return false;
                const createdAt = Date.parse(item.created_at);
                return Number.isFinite(createdAt) && createdAt >= Date.now() - recentHistoryMaxAgeMs;
            }

            function trimRecentHistory() {
                const cutoff = Date.now() - recentHistoryMaxAgeMs;
                [...historyBox.children].forEach(element => {
                    const createdAt = Date.parse(element.dataset.createdAt || '');
                    if (Number.isFinite(createdAt) && createdAt < cutoff) element.remove();
                });
                while (historyBox.childElementCount > recentHistoryLimit) {
                    historyBox.firstElementChild?.remove();
                }
            }

            function renderHistoryItem(item) {
                if (!isRecentHistoryItem(item)) return;
                const text = item.text;
                const captionId = item.id || '';
                if (!text || text.includes('통역 자막이') || text.includes('Speaking')) return;
                if (captionId && seenCaptionIds.has(captionId)) return;
                const p = document.createElement('p');
                p.className = 'border-l-2 border-slate-600 pl-3';
                p.innerText = text;
                if (captionId) {
                    p.dataset.captionId = captionId;
                    seenCaptionIds.add(captionId);
                }
                p.dataset.createdAt = item.created_at;
                historyBox.appendChild(p);
                trimRecentHistory();
                historyBox.scrollTop = historyBox.scrollHeight;
            }

            if (historyBox.dataset.historyKey !== historyKey) {
                historyBox.replaceChildren();
                historyBox.dataset.historyKey = historyKey;
                try {
                    const savedHistory = JSON.parse(sessionStorage.getItem(historyKey) || '[]');
                    savedHistory.filter(isRecentHistoryItem).slice(-recentHistoryLimit).forEach(renderHistoryItem);
                } catch (error) {
                    console.warn('Subtitle history restore failed', error);
                }
            }

            function pushToHistory(text, caption = null) {
                if (!text || text.includes('통역 자막이') || text.includes('Speaking')) return;
                const item = caption?.text ? caption : {
                    id: (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`),
                    text,
                    created_at: new Date().toISOString()
                };
                renderHistoryItem(item);
                try {
                    const savedHistory = JSON.parse(sessionStorage.getItem(historyKey) || '[]');
                    if (!savedHistory.some(saved => saved?.id && saved.id === item.id)) savedHistory.push(item);
                    const recentHistory = savedHistory
                        .filter(isRecentHistoryItem)
                        .slice(-recentHistoryLimit);
                    sessionStorage.setItem(historyKey, JSON.stringify(recentHistory));
                } catch (error) {
                    console.warn('Subtitle history save failed', error);
                }
            }

            const captionDisplay = createCaptionDisplayController(
                area,
                pushToHistory
            );

            ws.onopen = () => {
                setStatus('offline', '방 비밀번호 확인 중...');
                ws.send(JSON.stringify({ type: 'authenticate', password }));
                clearInterval(heartbeatTimer);
                heartbeatTimer = setInterval(() => {
                    if (ws?.readyState === WebSocket.OPEN) ws.send('ping');
                }, 20000);
            };
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'history_snapshot') {
                    recentHistoryLimit = Math.max(1, Number(data.policy?.max_items) || 30);
                    recentHistoryMaxAgeMs = Math.max(30000, (Number(data.policy?.max_age_seconds) || 300) * 1000);
                    const recentMinutes = Math.max(1, Math.round(recentHistoryMaxAgeMs / 60000));
                    document.getElementById('recent_history_label').innerText = `최근 ${recentMinutes}분 자막`;
                    (data.items || []).forEach(renderHistoryItem);
                    trimRecentHistory();
                } else if (data.type === 'room_status') {
                    const languageAudience = (data.audience_by_language || {})[lang] || 0;
                    document.getElementById('route_badge').innerText = `${lang} 공유 채널 · ${languageAudience}명`;
                    if (data.speaker_count > 0) {
                        setStatus('online', `강연자 연결됨 · ${lang} 통역 채널 공유 중`);
                    } else {
                        setStatus('offline', '강연자가 방을 시작하기를 기다리는 중…');
                    }
                } else if (data.type === 'transcript_delta') {
                    const sourceId = data.source_id || 'default';
                    if (!sourceTranscripts.has(sourceId)) captionDisplay.startCaption();
                    const sourceText = (sourceTranscripts.get(sourceId) || '') + (data.text || '');
                    sourceTranscripts.set(sourceId, sourceText);
                    if (lang === 'ko-KR') captionDisplay.updateCaption(sourceText);
                    else if (!translations.size) captionDisplay.updateCaption('원문 인식 중…', { sourcePreview: true });
                } else if (data.type === 'transcript_done') {
                    const sourceId = data.source_id || 'default';
                    sourceTranscripts.delete(sourceId);
                } else if (data.type === 'translation_delta') {
                    const sourceId = data.source_id || 'default';
                    if (!translations.has(sourceId)) captionDisplay.startCaption();
                    const translatedText = (translations.get(sourceId) || '') + (data.text || '');
                    translations.set(sourceId, translatedText);
                    captionDisplay.updateCaption(translatedText);
                } else if (data.type === 'translation_done') {
                    const sourceId = data.source_id || 'default';
                    const translatedText = translations.get(sourceId) || '';
                    const completedText = data.caption?.text || translatedText;
                    if (completedText) captionDisplay.completeCaption(completedText, data.caption);
                    translations.delete(sourceId);
                } else if (data.type === 'audio_delta') {
                    playPcm16(data.audio, data.sample_rate || 24000, data.source_id || 'default');
                } else if (data.type === 'engine_status') {
                    setStatus(data.state || 'online', data.message || 'GPT Realtime 통역 수신 중');
                } else if (data.type === 'engine_error') {
                    setStatus('error', data.message || '통역 엔진 오류');
                } else if (data.type === 'transcript') {
                    if (lang !== 'ko-KR') {
                        captionDisplay.startCaption();
                        captionDisplay.updateCaption('원문 인식 중…', { sourcePreview: true });
                    } else {
                        captionDisplay.startCaption();
                        captionDisplay.updateCaption(data.text, { sourcePreview: !data.is_final });
                        if (data.is_final) captionDisplay.completeCaption(data.text);
                    }
                } else if (data.type === 'translation') {
                    captionDisplay.completeCaption(data.text);
                    
                    // Phase 1에서는 audio가 빈 문자열로 옴 (자막만 먼저 도착)
                    if (data.audio) {
                        try {
                            const audioUrl = `data:audio/wav;base64,${data.audio}`;
                            const audio = new Audio(audioUrl);
                            audio.play().catch(e => console.error('Audio play failed:', e));
                        } catch(e) {}
                    }
                } else if (data.type === 'audio') {
                    // Phase 2: 음성만 별도 도착 → 즉시 재생
                    if (data.audio) {
                        try {
                            const audioUrl = `data:audio/wav;base64,${data.audio}`;
                            const audio = new Audio(audioUrl);
                            audio.play().catch(e => console.error('Audio play failed:', e));
                        } catch(e) {}
                    }
                }
            };
            ws.onclose = event => {
                captionDisplay.dispose({ promote: !isLeaving });
                clearInterval(heartbeatTimer);
                if (isLeaving || !audienceConfig) return;
                if (event.code === 4001) {
                    alert('방 이름 또는 비밀번호가 올바르지 않습니다.');
                    audienceConfig = null;
                    leaveSession();
                    return;
                }
                setStatus('offline', '연결 끊김 · 재연결 중…');
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connectAudience, 1500);
            };
        }

        function sendTestAudio() {
            if (speakerAuthenticated && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'test_audio' }));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(document.documentElement.dataset.theme, { persist: false });
            const params = new URLSearchParams(window.location.search);
            const room = cleanRoomId(params.get('room') || '');
            const language = params.get('lang');
            const audienceMode = params.get('mode') === 'audience';
            if (room) {
                document.getElementById('room_id').value = room;
                document.getElementById('room_hint').innerText = `초대받은 방 '${room}'에 청중으로 입장할 수 있습니다.`;
                const savedPassword = sessionStorage.getItem(`lovingvoice:room-password:${room}`);
                if (savedPassword) document.getElementById('room_password').value = savedPassword;
            }
            if (audienceMode) {
                document.getElementById('speaker_start_button').classList.add('hidden');
                document.getElementById('room_id').readOnly = Boolean(room);
                document.getElementById('room_password').focus();
            }
            if (language && [...document.getElementById('lang_select').options].some(option => option.value === language)) {
                document.getElementById('lang_select').value = language;
            }
        });
    </script>
</body>
